<div id="panneauFiltres">
    <h6 class="fw-bold mb-3"><i class="bi bi-funnel"></i> Recherche & Filtres</h6>

    <!-- Recherche par nom -->
    <div class="mb-3">
        <label class="form-label small">Rechercher un établissement</label>
        <input type="text" id="filtreRecherche" class="form-control form-control-sm"
               placeholder="Nom de l'établissement...">
    </div>

    <!-- Filtre par type -->
    <div class="mb-3">
        <label class="form-label small">Type d'établissement</label>
        <select id="filtreType" class="form-select form-select-sm">
            <option value="">Tous les types</option>
            <option value="poste_sante">Poste de santé</option>
            <option value="centre_sante">Centre de santé</option>
            <option value="hopital">Hôpital</option>
            <option value="clinique">Clinique</option>
            <option value="pharmacie">Pharmacie</option>
        </select>
    </div>

    <!-- Filtre par secteur -->
    <div class="mb-3">
        <label class="form-label small">Secteur</label>
        <div class="form-check">
            <input class="form-check-input filtreSecteur" type="checkbox" value="public" id="secteurPublic" checked>
            <label class="form-check-label" for="secteurPublic">Public</label>
        </div>
        <div class="form-check">
            <input class="form-check-input filtreSecteur" type="checkbox" value="prive" id="secteurPrive" checked>
            <label class="form-check-label" for="secteurPrive">Privé</label>
        </div>
    </div>

    <!-- Filtre par statut -->
    <div class="mb-3">
        <label class="form-label small">Statut</label>
        <select id="filtreStatut" class="form-select form-select-sm">
            <option value="">Tous les statuts</option>
            <option value="fonctionnel">Fonctionnel</option>
            <option value="ferme">Fermé</option>
            <option value="en_travaux">En travaux</option>
        </select>
    </div>

    <!-- Affichage des couches administratives -->
    <div class="mb-3">
        <label class="form-label small">Couches administratives</label>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="toggleCommune" checked>
            <label class="form-check-label" for="toggleCommune">Limites de la commune</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="toggleQuartiers" checked>
            <label class="form-check-label" for="toggleQuartiers">Quartiers</label>
        </div>
    </div>

    <button id="btnReinitialiser" class="btn btn-outline-secondary btn-sm w-100">
        <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
    </button>

    <div class="mt-2 text-muted small" id="compteurResultats"></div>
</div>
